<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>暗夜尸潮 · 竖屏版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
      font-family: 'Courier New', Courier, monospace;
    }
    /* 画布：宽=屏幕宽，高=屏幕高80%，贴顶 */
    #gameCanvas {
      display: block;
      background: #14181c;
      box-shadow: 0 0 30px #8b0000;
    }
    /* 底部控制栏：占据屏幕下方20% */
    #controls {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 20%;
      background: #0a0c0e;
      border-top: 2px solid #3a1f1f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }
    /* 摇杆 */
    #joystick {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(60, 80, 90, 0.25);
      border: 2px solid rgba(120, 160, 180, 0.5);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    #joystickKnob {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #9bc4d4, #3a5a6a);
      border: 2px solid #7fb0c4;
      box-shadow: 0 0 12px rgba(120, 180, 210, 0.7);
      will-change: transform;
    }
    /* 射击按钮 */
    #fireButton {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #d94a4a, #7a1010);
      border: 3px solid #e77;
      box-shadow: 0 0 20px rgba(230, 50, 50, 0.7), inset 0 0 18px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      color: #ffe0e0;
      touch-action: none;
      transition: transform 0.05s;
    }
    #fireButton.pressed {
      transform: scale(0.9);
      box-shadow: 0 0 28px rgba(255, 80, 80, 0.9), inset 0 0 18px rgba(0,0,0,0.6);
    }

    /* ===== HUD 浮层（贴在画布上方） ===== */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
      z-index: 20;
      display: flex;
      justify-content: center;
    }
    .hud-top {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 14px;
      background: rgba(20, 24, 28, 0.85);
      border-radius: 40px;
      border: 1px solid #5e3737;
      box-shadow: 0 0 14px rgba(139, 0, 0, 0.5);
      color: #c0b9b0;
      font-weight: bold;
      font-size: 0.85rem;
      white-space: nowrap;
      pointer-events: auto;
    }
    .hp-fill {
      width: 90px;
      height: 12px;
      background: #2b1e1e;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 0 8px #000;
      border: 1px solid #5e3737;
    }
    .hp-fill span {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #b30000, #e63946);
      border-radius: 20px;
      transition: width 0.15s ease;
    }
    .stat { color: #d4af37; }
    .stat.level { color: #c084fc; }
    #restartBtn {
      background: #1e1212;
      border: 1px solid #6b3a3a;
      color: #ddbbbb;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 40px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      pointer-events: auto;
    }
    #restartBtn:active { background: #3a1f1f; color: #fff; }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hud-top">
    <div style="display:flex;align-items:center;gap:6px;">
      <span>❤️</span>
      <div class="hp-fill"><span id="hpBarFill" style="width:100%"></span></div>
    </div>
    <div class="stat">🔫 <span id="killCount">0</span></div>
    <div class="stat level">⭐ <span id="levelDisplay">1</span></div>
    <button id="restartBtn">⟲ 重来</button>
  </div>
</div>

<!-- 底部控制栏 -->
<div id="controls">
  <div id="joystick"><div id="joystickKnob"></div></div>
  <div id="fireButton">🔫</div>
</div>

<script>
(function() {
  'use strict';

  // =========================================================
  // 画布尺寸：宽 = 屏幕宽，高 = 屏幕高 * 0.8
  // =========================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let W = window.innerWidth;
  let H = Math.floor(window.innerHeight * 0.8);

  function resizeCanvas() {
    W = window.innerWidth;
    H = Math.floor(window.innerHeight * 0.8);
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // 保证玩家在底部
    if (player) {
      player.y = H - 50;
      player.x = Math.min(player.x, W - 30);
      player.x = Math.max(player.x, 30);
    }
  }

  // =========================================================
  // 游戏状态
  // =========================================================
  let gameActive = true;

  let player = {
    x: W / 2,
    y: H - 50,
    radius: 18,
    speed: 4,
    hp: 100,
    maxHp: 100
  };

  // 摇杆输入
  let inputX = 0, inputY = 0;
  // 瞄准角度（默认朝上）
  let aimAngle = -Math.PI / 2;

  let zombies = [];
  let bullets = [];
  let pickups = [];

  let killCount = 0;
  let currentLevel = 1;
  let speedMultiplier = 1.0;

  let lastZombieSpawn = 0;
  let zombieSpawnInterval = 1200;
  let lastTimestamp = 0;

  let lastShotTime = 0;
  const SHOT_COOLDOWN = 180;

  let fireHeld = false;

  let hasShotgun = false;
  let shotgunTimer = 0;
  const SHOTGUN_DURATION = 8000;

  // DOM
  const hpBarFill = document.getElementById('hpBarFill');
  const killCountSpan = document.getElementById('killCount');
  const levelDisplay = document.getElementById('levelDisplay');
  const restartBtn = document.getElementById('restartBtn');
  const joystick = document.getElementById('joystick');
  const joystickKnob = document.getElementById('joystickKnob');
  const fireButton = document.getElementById('fireButton');

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function distance(x1,y1,x2,y2){ return Math.hypot(x2-x1, y2-y1); }

  // =========================================================
  // 音效
  // =========================================================
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playShootSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.07);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1)*Math.pow(1-i/bufferSize, 2.5);
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const nf = audioCtx.createBiquadFilter(); nf.type='highpass'; nf.frequency.value=800;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.2, now); ng.gain.exponentialRampToValueAtTime(0.001, now+0.07);
    noise.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
    noise.start(now); noise.stop(now+0.08);
  }
  function playZombieDeathSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
    osc.type='sawtooth'; osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(40, now+0.22);
    g.gain.setValueAtTime(0.15, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.25);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now+0.25);
  }
  function playPickupSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
    osc.type='sine'; osc.frequency.setValueAtTime(660, now);
    osc.frequency.setValueAtTime(880, now+0.08);
    g.gain.setValueAtTime(0.12, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.18);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now+0.18);
  }
  function playLevelUpSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [523, 659, 784].forEach((freq, i) => {
      const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
      osc.type='triangle'; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.1, now + i*0.07);
      g.gain.exponentialRampToValueAtTime(0.001, now + i*0.07 + 0.22);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now + i*0.07); osc.stop(now + i*0.07 + 0.22);
    });
  }

  // =========================================================
  // 重置
  // =========================================================
  function resetGame() {
    gameActive = true;
    player = {
      x: W / 2, y: H - 50,
      radius: 18, speed: 4,
      hp: 100, maxHp: 100
    };
    zombies = []; bullets = []; pickups = [];
    killCount = 0; currentLevel = 1; speedMultiplier = 1.0;
    killCountSpan.textContent = '0';
    levelDisplay.textContent = '1';
    hpBarFill.style.width = '100%';
    lastZombieSpawn = 0;
    zombieSpawnInterval = 1200;
    hasShotgun = false; shotgunTimer = 0;
    aimAngle = -Math.PI / 2;
    inputX = 0; inputY = 0;
    fireHeld = false;
    joystickKnob.style.transform = 'translate(0px, 0px)';

    for (let i = 0; i < 3; i++) spawnZombie();
    draw();
  }

  function updateHpBar() {
    hpBarFill.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
  }

  // =========================================================
  // 生成丧尸（从上方和两侧进入）
  // =========================================================
  function spawnZombie() {
    let x, y;
    const r = Math.random();
    if (r < 0.6) {
      // 从上方进入
      x = Math.random() * W;
      y = -30;
    } else if (r < 0.8) {
      // 左侧
      x = -30;
      y = Math.random() * (H * 0.6);
    } else {
      // 右侧
      x = W + 30;
      y = Math.random() * (H * 0.6);
    }
    const baseSpeed = 0.6 + Math.random() * 0.5;
    zombies.push({
      x, y, radius: 16,
      speed: baseSpeed * speedMultiplier,
      baseSpeed: baseSpeed,
      hp: 1, flash: 0,
      wobble: Math.random() * Math.PI * 2,
      phase: Math.random() * 10
    });
  }

  // =========================================================
  // 射击
  // =========================================================
  function shoot(now) {
    if (!gameActive) return;
    if (now - lastShotTime < SHOT_COOLDOWN) return;
    lastShotTime = now;
    playShootSound();

    // 自动瞄准最近的丧尸（如果存在）
    let targetAngle = aimAngle;
    if (zombies.length > 0) {
      let closest = null;
      let closestDist = Infinity;
      for (const z of zombies) {
        const d = distance(player.x, player.y, z.x, z.y);
        if (d < closestDist) { closestDist = d; closest = z; }
      }
      if (closest) {
        targetAngle = Math.atan2(closest.y - player.y, closest.x - player.x);
      }
    }

    if (hasShotgun) {
      const spread = 0.35, count = 5;
      for (let i = 0; i < count; i++) {
        const offset = (i - (count-1)/2) * (spread/(count-1)) * 2;
        createBullet(targetAngle + offset);
      }
    } else {
      createBullet(targetAngle);
    }
  }

  function createBullet(angle) {
    const speed = 10;
    const offset = 20;
    bullets.push({
      x: player.x + Math.cos(angle) * offset,
      y: player.y + Math.sin(angle) * offset,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: 6,
      life: 80,
      damage: 1
    });
  }

  // =========================================================
  // 更新
  // =========================================================
  function updatePlayer() {
    // 摇杆输入
    let dx = inputX, dy = inputY;
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      player.x += dx * player.speed;
      player.y += dy * player.speed;
    }
    // 边界
    player.x = clamp(player.x, player.radius, W - player.radius);
    // 竖直限制在画布内，但主要活动范围中下部
    player.y = clamp(player.y, player.radius + 30, H - player.radius);
  }

  function updateZombies(dt) {
    const d = dt / 16.67;
    for (let i = zombies.length - 1; i >= 0; i--) {
      const z = zombies[i];
      const angle = Math.atan2(player.y - z.y, player.x - z.x);
      z.wobble += 0.07;
      const wob = Math.sin(z.wobble) * 0.25;
      const spd = z.speed * d * 1.3;
      z.x += Math.cos(angle + wob*0.2) * spd;
      z.y += Math.sin(angle + wob*0.2) * spd;

      if (z.flash > 0) { z.flash -= 0.05 * d; if (z.flash < 0) z.flash = 0; }

      if (distance(z.x, z.y, player.x, player.y) < z.radius + player.radius) {
        player.hp = Math.max(0, player.hp - 1.0 * d);
        updateHpBar();
        // 击退
        const ka = Math.atan2(z.y - player.y, z.x - player.x);
        z.x += Math.cos(ka) * 2.5;
        z.y += Math.sin(ka) * 2.5;
        if (player.hp <= 0) {
          player.hp = 0; updateHpBar();
          gameActive = false; return;
        }
      }
    }
  }

  function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30 || b.life <= 0) {
        bullets.splice(i, 1); continue;
      }
      let hit = false;
      for (let j = zombies.length - 1; j >= 0; j--) {
        const z = zombies[j];
        if (distance(b.x, b.y, z.x, z.y) < z.radius + b.radius) {
          z.hp -= b.damage; z.flash = 1.0; hit = true;
          if (z.hp <= 0) {
            zombies.splice(j, 1);
            killCount++; killCountSpan.textContent = killCount;
            playZombieDeathSound();

            if (Math.random() < 0.20) {
              const dropType = Math.random() < 0.5 ? 'health' : 'shotgun';
              pickups.push({
                x: z.x, y: z.y, radius: 14,
                type: dropType, life: 12000, bob: Math.random() * Math.PI * 2
              });
            }
            if (killCount > 0 && killCount % 10 === 0) {
              currentLevel++;
              speedMultiplier += 0.25;
              levelDisplay.textContent = currentLevel;
              zombies.forEach(zz => { zz.speed = (zz.baseSpeed || 0.8) * speedMultiplier; });
              zombieSpawnInterval = Math.max(400, zombieSpawnInterval - 120);
              playLevelUpSound();
            }
          }
          break;
        }
      }
      if (hit) bullets.splice(i, 1);
    }
  }

  function updatePickups(dt) {
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      p.life -= dt; p.bob += 0.05;
      if (distance(p.x, p.y, player.x, player.y) < p.radius + player.radius + 8) {
        if (p.type === 'health') {
          player.hp = Math.min(player.maxHp, player.hp + 30);
          updateHpBar();
        } else {
          hasShotgun = true; shotgunTimer = SHOTGUN_DURATION;
        }
        playPickupSound();
        pickups.splice(i, 1); continue;
      }
      if (p.life <= 0) pickups.splice(i, 1);
    }
    if (hasShotgun) {
      shotgunTimer -= dt;
      if (shotgunTimer <= 0) { hasShotgun = false; shotgunTimer = 0; }
    }
  }

  function spawnZombiesByTime(now) {
    if (!gameActive) return;
    if (now - lastZombieSpawn > zombieSpawnInterval) {
      lastZombieSpawn = now;
      spawnZombie();
      if (Math.random() < 0.3 && zombies.length < 30) spawnZombie();
      if (currentLevel > 3 && Math.random() < 0.2 && zombies.length < 35) spawnZombie();
    }
  }

  // =========================================================
  // 绘制
  // =========================================================
  function draw() {
    // 背景
    ctx.fillStyle = '#12181c';
    ctx.fillRect(0, 0, W, H);

    // 地砖
    const tile = 50;
    for (let ty = 0; ty < H; ty += tile) {
      for (let tx = 0; tx < W; tx += tile) {
        const alt = ((tx/tile)+(ty/tile)) % 2 === 0;
        ctx.fillStyle = alt ? '#161e24' : '#121920';
        ctx.fillRect(tx, ty, tile, tile);
      }
    }
    // 网格
    ctx.strokeStyle = '#1f2a30'; ctx.lineWidth = 0.8;
    for (let i = 0; i <= W; i += tile) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
    }
    for (let i = 0; i <= H; i += tile) {
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
    }

    // 掉落物
    pickups.forEach(p => {
      const bobY = Math.sin(p.bob) * 4;
      ctx.font = '28px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = p.type === 'health' ? '#44ff88' : '#ffaa44';
      ctx.shadowBlur = 18;
      ctx.fillText(p.type === 'health' ? '💊' : '🔥', p.x, p.y + bobY);
      ctx.shadowBlur = 0;
    });

    // 丧尸
    ctx.font = '32px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    zombies.forEach(z => {
      if (z.flash > 0.1) ctx.filter = `brightness(${1 + z.flash * 1.5})`;
      else ctx.filter = 'none';
      const bobY = Math.sin(z.phase + Date.now() * 0.008) * 3;
      ctx.fillText('🧟‍♂️', z.x, z.y + bobY);
      ctx.filter = 'none';
    });

    // 子弹
    bullets.forEach(b => {
      ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffe070'; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x, b.y, b.radius * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
    });
    ctx.shadowBlur = 0;

    // 玩家
    ctx.shadowColor = '#44cc88'; ctx.shadowBlur = 22;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 4, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(80,220,140,0.55)'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.font = '38px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const pb = Math.sin(Date.now() * 0.006) * 2;
    ctx.fillText('🤠', player.x, player.y + pb);

    // 散弹枪 BUFF 条
    if (hasShotgun) {
      const barW = 70, barH = 7;
      const barX = player.x - barW / 2, barY = player.y - 40;
      ctx.fillStyle = '#333'; ctx.fillRect(barX, barY, barW, barH);
      const ratio = shotgunTimer / SHOTGUN_DURATION;
      ctx.fillStyle = '#ffaa33'; ctx.fillRect(barX, barY, barW * ratio, barH);
      ctx.strokeStyle = '#ffaa33'; ctx.lineWidth = 1;
      ctx.strokeRect(barX, barY, barW, barH);
    }

    // 游戏结束
    if (!gameActive) {
      ctx.fillStyle = 'rgba(10,0,0,0.82)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 36px "Courier New",monospace';
      ctx.fillStyle = '#b30000';
      ctx.shadowBlur = 25; ctx.shadowColor = '#ff0000';
      ctx.fillText('💀 你被吞噬了', W / 2, H / 2 - 50);
      ctx.font = '24px "Courier New"';
      ctx.fillStyle = '#d4af37';
      ctx.shadowBlur = 0;
      ctx.fillText(`击杀: ${killCount}   关卡: ${currentLevel}`, W / 2, H / 2 + 10);
      ctx.font = '18px "Courier New"';
      ctx.fillStyle = '#999';
      ctx.fillText('点击「重来」继续', W / 2, H / 2 + 60);
    }
  }

  // =========================================================
  // 主循环
  // =========================================================
  function gameLoop(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const dt = Math.min(32, timestamp - lastTimestamp);
    lastTimestamp = timestamp;

    if (gameActive) {
      updatePlayer();
      updateZombies(dt);
      updateBullets();
      updatePickups(dt);
      spawnZombiesByTime(timestamp);

      if (player.hp <= 0) {
        gameActive = false; player.hp = 0; updateHpBar();
      }

      if (fireHeld) shoot(timestamp);
    }

    draw();
    requestAnimationFrame(gameLoop);
  }

  // =========================================================
  // 虚拟摇杆（简单版）
  // =========================================================
  let joystickTouchId = null;
  let joyCenterX = 0, joyCenterY = 0, joyMax = 40;

  function joyStart(e) {
    e.preventDefault(); e.stopPropagation();
    initAudio();
    const touch = e.changedTouches[0];
    joystickTouchId = touch.identifier;
    const rect = joystick.getBoundingClientRect();
    joyCenterX = rect.left + rect.width / 2;
    joyCenterY = rect.top + rect.height / 2;
    joyMax = rect.width * 0.35;
    joyMove(e);
  }

  function joyMove(e) {
    if (joystickTouchId === null) return;
    e.preventDefault(); e.stopPropagation();
    let touch = null;
    for (let i = 0; i < e.touches.length; i++) {
      if (e.touches[i].identifier === joystickTouchId) { touch = e.touches[i]; break; }
    }
    if (!touch) return;
    let dx = touch.clientX - joyCenterX;
    let dy = touch.clientY - joyCenterY;
    const dist = Math.hypot(dx, dy);
    if (dist > joyMax) { dx = (dx / dist) * joyMax; dy = (dy / dist) * joyMax; }
    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    const nx = dx / joyMax, ny = dy / joyMax;
    const dead = 0.2;
    inputX = Math.abs(nx) > dead ? nx : 0;
    inputY = Math.abs(ny) > dead ? ny : 0;
  }

  function joyEnd(e) {
    if (joystickTouchId === null) return;
    e.preventDefault(); e.stopPropagation();
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joystickTouchId) {
        joystickTouchId = null;
        inputX = 0; inputY = 0;
        joystickKnob.style.transform = 'translate(0px, 0px)';
        break;
      }
    }
  }

  // =========================================================
  // 射击按钮
  // =========================================================
  let fireTouchId = null;

  function fireStart(e) {
    e.preventDefault(); e.stopPropagation();
    initAudio();
    if (!gameActive) return;
    const touch = e.changedTouches[0];
    fireTouchId = touch.identifier;
    fireHeld = true;
    fireButton.classList.add('pressed');
    shoot(performance.now());
  }

  function fireEnd(e) {
    if (fireTouchId === null) return;
    e.preventDefault(); e.stopPropagation();
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === fireTouchId) {
        fireTouchId = null;
        fireHeld = false;
        fireButton.classList.remove('pressed');
        break;
      }
    }
  }

  // =========================================================
  // 事件绑定
  // =========================================================
  joystick.addEventListener('touchstart', joyStart, { passive: false });
  joystick.addEventListener('touchmove', joyMove, { passive: false });
  joystick.addEventListener('touchend', joyEnd, { passive: false });
  joystick.addEventListener('touchcancel', joyEnd, { passive: false });

  fireButton.addEventListener('touchstart', fireStart, { passive: false });
  fireButton.addEventListener('touchend', fireEnd, { passive: false });
  fireButton.addEventListener('touchcancel', fireEnd, { passive: false });

  // 游戏结束时也能点击重来
  restartBtn.addEventListener('click', resetGame);
  restartBtn.addEventListener('touchstart', (e) => {
    e.preventDefault(); e.stopPropagation();
    resetGame();
  }, { passive: false });

  // 阻止页面滚动
  document.addEventListener('touchmove', (e) => {
    if (!e.target.closest('#joystick') && !e.target.closest('#fireButton') && !e.target.closest('#restartBtn')) {
      e.preventDefault();
    }
  }, { passive: false });

  // 窗口尺寸变化
  window.addEventListener('resize', () => {
    resizeCanvas();
    resetGame();
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { resizeCanvas(); resetGame(); }, 150);
  });

  // =========================================================
  // 启动
  // =========================================================
  resizeCanvas();
  resetGame();
  requestAnimationFrame(gameLoop);

  // 首次触摸初始化音频
  document.addEventListener('touchstart', function once() {
    initAudio();
    document.removeEventListener('touchstart', once);
  }, { once: true });

})();
</script>
</body>
</html>
