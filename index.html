<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>暗夜丧尸 · 生存射击</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030509; font-family: 'Segoe UI', 'Courier New', monospace; touch-action: none; }
    #stage { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at 50% 50%, #0a1020 0%, #030509 100%); }
    #gameCanvas { position: relative; display: block; width: 450px; height: 800px; max-width: 100vw; max-height: 100vh; aspect-ratio: 9 / 16; background: #0a0e18; box-shadow: 0 0 40px rgba(0, 255, 200, 0.15), 0 0 80px rgba(0, 0, 0, 0.8); touch-action: none; }

    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; padding: 18px 16px; font-size: 13px; color: #7df9ff; text-shadow: 0 0 6px #00e5ff, 0 0 14px #00b3cc; letter-spacing: 1px; }
    .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .score-block { text-align: left; }
    .score-label { font-size: 10px; color: #5ac8d8; letter-spacing: 3px; opacity: 0.8; }
    #killCount { font-size: 22px; font-weight: bold; color: #00ffe0; text-shadow: 0 0 8px #00ffe0, 0 0 24px #00b3cc, 0 0 40px #007a8a; line-height: 1.1; }
    .high-score-mini { font-size: 11px; color: #ffcf5c; text-shadow: 0 0 6px #ffaa00, 0 0 14px #cc8800; }
    .right-block { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    #levelDisplay { font-size: 14px; font-weight: bold; color: #ff6ec7; text-shadow: 0 0 8px #ff6ec7, 0 0 20px #b3007a; letter-spacing: 2px; }
    #buffBar { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; margin-top: 2px; }
    .buff-chip { font-size: 10px; letter-spacing: 1px; padding: 3px 9px; border-radius: 10px; display: none; white-space: nowrap; }
    #buffWeapon { color: #2b1400; background: linear-gradient(90deg, #ffd700, #ffaa00); box-shadow: 0 0 12px #ffaa00; }
    #buffSpeed { color: #001a2b; background: linear-gradient(90deg, #7df9ff, #00b3cc); box-shadow: 0 0 12px #00e5ff; }

    #hpBarWrap { margin-top: 12px; width: 100%; height: 22px; border: 2px solid rgba(0, 229, 255, 0.5); border-radius: 12px; background: rgba(0, 20, 35, 0.75); box-shadow: inset 0 0 12px rgba(0, 229, 255, 0.25), 0 0 14px rgba(0, 229, 255, 0.3); overflow: hidden; position: relative; }
    #hpBarFill { height: 100%; width: 100%; border-radius: 10px; background: linear-gradient(90deg, #00ffb3 0%, #00e5ff 40%, #b44bff 100%); box-shadow: 0 0 16px rgba(0, 255, 200, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.4); transition: width 0.18s linear; }
    .hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; color: #eaffff; text-shadow: 0 0 6px #000, 0 0 10px #00e5ff; letter-spacing: 2px; font-weight: bold; pointer-events: none; }

    #touchControls { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
    #touchControls.active { display: block; }
    #joystick { position: absolute; bottom: 40px; left: 30px; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(0, 229, 255, 0.35); background: rgba(0, 40, 60, 0.25); box-shadow: 0 0 24px rgba(0, 229, 255, 0.25); pointer-events: auto; touch-action: none; }
    #joystickKnob { position: absolute; top: 50%; left: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: radial-gradient(circle, #00ffd5, #007a8a); box-shadow: 0 0 18px #00e5ff, inset 0 0 8px #ffffff88; pointer-events: none; }
    #fireButton { position: absolute; bottom: 55px; right: 30px; width: 100px; height: 100px; border-radius: 50%; border: 2px solid rgba(255, 110, 199, 0.5); background: radial-gradient(circle, rgba(255, 60, 160, 0.35), rgba(120, 0, 80, 0.25)); box-shadow: 0 0 28px rgba(255, 110, 199, 0.5); color: #ffd6f5; font-size: 12px; font-weight: bold; letter-spacing: 2px; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; text-shadow: 0 0 8px #ff2fa0; }

    #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px 24px; background: radial-gradient(circle at 50% 40%, #1a0508 0%, #030509 85%); z-index: 25; text-align: center; }
    #gameOverScreen.active { display: flex; }
    .over-title { font-size: 34px; font-weight: 900; letter-spacing: 8px; color: #ff2f5e; text-shadow: 0 0 12px #ff2f5e, 0 0 34px #b3002a, 0 0 70px #7a001a; margin-bottom: 8px; }
    .over-sub { font-size: 12px; letter-spacing: 5px; color: #ff8fa8; margin-bottom: 34px; opacity: 0.9; }
    .result-panel { width: 100%; max-width: 310px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 34px; }
    .result-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-radius: 12px; background: rgba(0, 25, 45, 0.6); border: 1px solid rgba(0, 229, 255, 0.3); box-shadow: 0 0 18px rgba(0, 229, 255, 0.15), inset 0 0 14px rgba(0, 80, 120, 0.25); }
    .result-row .label { font-size: 13px; letter-spacing: 3px; color: #8be9ff; }
    .result-row .value { font-size: 22px; font-weight: bold; letter-spacing: 1px; }
    .result-row.best .value { color: #ffcf5c; text-shadow: 0 0 10px #ffaa00, 0 0 22px #cc8800; }
    .result-row.current .value { color: #00ffe0; text-shadow: 0 0 10px #00ffe0, 0 0 24px #00b3cc; }
    .new-record { font-size: 13px; color: #ffcf5c; letter-spacing: 4px; text-shadow: 0 0 10px #ffaa00, 0 0 22px #cc8800; animation: recordPulse 1s ease-in-out infinite alternate; margin-top: -14px; margin-bottom: 26px; }
    @keyframes recordPulse { from { opacity: 0.65; transform: scale(1); } to { opacity: 1; transform: scale(1.06); } }
    #restartBtn { padding: 14px 46px; font-size: 15px; font-weight: bold; letter-spacing: 5px; color: #030509; background: linear-gradient(90deg, #00ffb3, #00e5ff, #b44bff); border: none; border-radius: 40px; cursor: pointer; box-shadow: 0 0 24px rgba(0, 229, 255, 0.7), 0 0 60px rgba(0, 255, 200, 0.35); transition: transform 0.15s ease; touch-action: manipulation; position: relative; z-index: 30; }
    #restartBtn:active { transform: scale(0.95); }
  </style>
</head>
<body>
<div id="stage">
  <canvas id="gameCanvas" width="450" height="800"></canvas>

  <div id="hud">
    <div class="hud-top">
      <div class="score-block">
        <div class="score-label">击杀 / SCORE</div>
        <div id="killCount">0</div>
        <div class="high-score-mini">最高 <span id="hudHighScore">0</span></div>
      </div>
      <div class="right-block">
        <div id="levelDisplay">LV.1</div>
        <div id="buffBar">
          <div class="buff-chip" id="buffWeapon">🌟 三发散射</div>
          <div class="buff-chip" id="buffSpeed">⚡ 加速</div>
        </div>
      </div>
    </div>
    <div id="hpBarWrap">
      <div id="hpBarFill"></div>
      <div class="hp-text">HP</div>
    </div>
  </div>

  <div id="touchControls">
    <div id="joystick"><div id="joystickKnob"></div></div>
    <div id="fireButton">FIRE</div>
  </div>

  <div id="gameOverScreen">
    <div class="over-title">GAME OVER</div>
    <div class="over-sub">你已被丧尸吞噬</div>
    <div class="result-panel">
      <div class="result-row best">
        <span class="label">最高分</span>
        <span class="value" id="finalHighScore">0</span>
      </div>
      <div class="result-row current">
        <span class="label">本局得分</span>
        <span class="value" id="finalScore">0</span>
      </div>
    </div>
    <div class="new-record" id="newRecordText" style="display:none;">★ 新纪录 ★</div>
    <button id="restartBtn" type="button">再来一局</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  /* ========== 基础配置 ========== */
  const W = 450, H = 800;
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const hpBarFill      = document.getElementById('hpBarFill');
  const killCountEl    = document.getElementById('killCount');
  const levelDisplay   = document.getElementById('levelDisplay');
  const hudHighScore   = document.getElementById('hudHighScore');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalHighScore = document.getElementById('finalHighScore');
  const finalScore     = document.getElementById('finalScore');
  const newRecordText  = document.getElementById('newRecordText');
  const restartBtn     = document.getElementById('restartBtn');
  const touchControls  = document.getElementById('touchControls');
  const joystick       = document.getElementById('joystick');
  const joystickKnob   = document.getElementById('joystickKnob');
  const fireButton     = document.getElementById('fireButton');
  const buffWeaponEl   = document.getElementById('buffWeapon');
  const buffSpeedEl    = document.getElementById('buffSpeed');

  /* ========== 最高分 ========== */
  const HS_KEY = 'zombie_survival_highscore';
  let highScore = parseInt(localStorage.getItem(HS_KEY) || '0', 10);
  if (isNaN(highScore)) highScore = 0;
  hudHighScore.textContent = highScore;

  /* ========== 游戏状态 ========== */
  let running = false;
  let gameTime = 0;
  let lastTime = 0;
  let spawnTimer = 0;
  let spawnInterval = 1200;
  let kills = 0;
  let level = 1;
  let speedMultiplier = 1;

  let player = null;
  let zombies = [];
  let bullets = [];
  let items = [];          // ← 道具数组（统一命名 items）
  let particles = [];
  let floatTexts = [];

  let aimAngle = 0;
  let shotCd = 0;
  let weaponBuffTimer = 0;
  let speedBuffTimer = 0;

  // 玩家碰撞半径与道具半径（用于碰撞检测）
  const PLAYER_RADIUS = 18;
  const ITEM_RADIUS = 15;        // 道具碰撞半径
  const PICKUP_DIST = PLAYER_RADIUS + ITEM_RADIUS;  // = 33
  const PICKUP_DIST_SQ = PICKUP_DIST * PICKUP_DIST; // 用平方距离，避免开方

  const SHOT_CD = 180;
  const SHOT_CD_BUFF = 110;
  const WEAPON_BUFF_DUR = 10000;
  const SPEED_BUFF_DUR = 5000;
  const BASE_SPEED = 4.5;
  const SPEED_BUFF_MUL = 1.7;
  const HEAL_AMOUNT = 20;        // ★ 恢复 20 点生命

  const keys = {};
  let mouseX = W / 2, mouseY = H / 2;

  let joyId = null, fireId = null;
  let joyX = 0, joyY = 0;
  let fireActive = false;

  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) touchControls.classList.add('active');

  /* ========== 音效 ========== */
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  function playShoot()       { beep(880, 0.06, 'square', 0.05); }
  function playZombieDeath() { beep(180, 0.22, 'sawtooth', 0.08); }
  function playPickup()      { beep(1200, 0.12, 'sine', 0.1); }
  function playLevelUp()     { beep(660, 0.15, 'square', 0.09); setTimeout(() => beep(990, 0.2, 'square', 0.09), 120); }
  function playBuff()        { beep(760, 0.1, 'square', 0.09); setTimeout(() => beep(1140, 0.18, 'square', 0.09), 100); }

  /* ========== 粒子 & 飘字 ========== */
  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color: color || '#7df9ff', size: 2 + Math.random() * 2 });
    }
  }
  function spawnFloatText(x, y, text, color) {
    floatTexts.push({ x, y, text, color: color || '#ffcf5c', life: 1, vy: -0.9 });
  }

  /* ========== 初始化 ========== */
  function resetGame() {
    running = true;
    gameTime = 0; spawnTimer = 0; spawnInterval = 1200;
    kills = 0; level = 1; speedMultiplier = 1;

    zombies = []; bullets = []; items = []; particles = []; floatTexts = [];

    shotCd = 0; weaponBuffTimer = 0; speedBuffTimer = 0;
    aimAngle = 0; mouseX = W / 2; mouseY = H / 2;

    player = {
      x: W / 2,
      y: H / 2,
      radius: PLAYER_RADIUS,
      speed: BASE_SPEED,
      hp: 100,
      maxHp: 100
    };

    for (let i = 0; i < 3; i++) spawnZombie();
    updateHUD();
  }

  function spawnZombie() {
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * W; y = -30; }
    else if (edge === 1) { x = W + 30; y = Math.random() * H; }
    else if (edge === 2) { x = Math.random() * W; y = H + 30; }
    else { x = -30; y = Math.random() * H; }
    zombies.push({ x, y, radius: 16, speed: (0.9 + Math.random() * 0.6) * speedMultiplier, hp: 1 });
  }

  function updateHUD() {
    killCountEl.textContent = kills;
    levelDisplay.textContent = 'LV.' + level;
    const pct = Math.max(0, player ? player.hp / player.maxHp * 100 : 0);
    hpBarFill.style.width = pct + '%';

    if (weaponBuffTimer > 0) {
      buffWeaponEl.style.display = 'block';
      buffWeaponEl.textContent = '🌟 三发散射 ' + Math.ceil(weaponBuffTimer / 1000) + 's';
    } else buffWeaponEl.style.display = 'none';

    if (speedBuffTimer > 0) {
      buffSpeedEl.style.display = 'block';
      buffSpeedEl.textContent = '⚡ 加速 ' + Math.ceil(speedBuffTimer / 1000) + 's';
    } else buffSpeedEl.style.display = 'none';
  }

  /* ========== 键盘 ========== */
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  /* ========== 鼠标 ========== */
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouseX = (e.clientX - r.left) / r.width * W;
    mouseY = (e.clientY - r.top) / r.height * H;
    if (player) aimAngle = Math.atan2(mouseY - player.y, mouseX - player.x);
  });
  canvas.addEventListener('mousedown', e => {
    if (!running) return;
    e.preventDefault(); initAudio(); tryShoot();
  });

  /* ========== 摇杆 ========== */
  function updateJoystickFromTouch(t) {
    const r = joystick.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    let dx = t.clientX - cx, dy = t.clientY - cy;
    const dist = Math.hypot(dx, dy);
    const maxR = r.width / 2 - 6;
    if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
    joyX = dx / maxR; joyY = dy / maxR;
    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  }
  function resetJoystick() { joyX = 0; joyY = 0; joystickKnob.style.transform = 'translate(0,0)'; }

  joystick.addEventListener('touchstart', e => {
    e.preventDefault(); initAudio();
    if (joyId === null) { const t = e.changedTouches[0]; joyId = t.identifier; updateJoystickFromTouch(t); }
  }, { passive: false });
  joystick.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === joyId) updateJoystickFromTouch(t);
  }, { passive: false });
  function endJoy(e) {
    for (const t of e.changedTouches) if (t.identifier === joyId) { joyId = null; resetJoystick(); }
  }
  joystick.addEventListener('touchend', endJoy);
  joystick.addEventListener('touchcancel', endJoy);

  /* ========== 射击键 ========== */
  fireButton.addEventListener('touchstart', e => {
    e.preventDefault(); initAudio(); fireActive = true;
    if (fireId === null) fireId = e.changedTouches[0].identifier;
  }, { passive: false });
  fireButton.addEventListener('touchend', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === fireId) { fireId = null; fireActive = false; }
  }, { passive: false });
  fireButton.addEventListener('touchcancel', () => { fireId = null; fireActive = false; });

  // 阻止页面滑动
  document.addEventListener('touchmove', e => {
    if (e.target === canvas || e.target === joystick || e.target === fireButton ||
        joystick.contains(e.target) || fireButton.contains(e.target)) e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  /* ========== 射击 ========== */
  function tryShoot() {
    if (!player || shotCd > 0) return;
    const upgraded = weaponBuffTimer > 0;
    shotCd = upgraded ? SHOT_CD_BUFF : SHOT_CD;

    let target = null, minDist = Infinity;
    for (const z of zombies) {
      const d = Math.hypot(z.x - player.x, z.y - player.y);
      if (d < minDist) { minDist = d; target = z; }
    }
    if (target) aimAngle = Math.atan2(target.y - player.y, target.x - player.x);

    const angles = upgraded ? [-0.22, 0, 0.22] : [0];
    for (const off of angles) {
      const a = aimAngle + off;
      bullets.push({ x: player.x, y: player.y, vx: Math.cos(a) * 11, vy: Math.sin(a) * 11, radius: 3.5, life: 1 });
    }
    playShoot();
  }

  /* ========== 掉落 ========== */
  function tryDrop(x, y) {
    if (Math.random() < 0.15) {
      const r = Math.random();
      let type;
      if (r < 0.4)      type = 'heart';
      else if (r < 0.7) type = 'lightning';
      else              type = 'star';
      items.push({ x, y, radius: ITEM_RADIUS, type, life: 12, bob: 0 });
    }
  }

  const DROP_EMOJI = { heart: '❤️', lightning: '⚡', star: '🌟' };
  const DROP_COLOR = { heart: '#ff2f5e', lightning: '#00e5ff', star: '#ffcf5c' };

  /* ========== ★ 拾取处理（修复核心） ========== */
  function pickupItem(item) {
    if (!item || !player) return;

    if (item.type === 'heart') {
      // ★ 严格按 Math.min(player.hp + 20, player.maxHp) 格式
      const before = player.hp;
      player.hp = Math.min(player.hp + HEAL_AMOUNT, player.maxHp);
      const gained = Math.round(player.hp - before);
      // 即使满血也显示提示（gained 可能为 0）
      spawnFloatText(item.x, item.y, gained > 0 ? ('+' + gained + ' 生命') : '生命已满', '#ff5e9e');
      // 回血音效（升调）
      beep(600, 0.08, 'sine', 0.1);
      setTimeout(() => beep(900, 0.12, 'sine', 0.1), 70);
    } else if (item.type === 'lightning') {
      speedBuffTimer = SPEED_BUFF_DUR;
      spawnFloatText(item.x, item.y, '⚡ 加速！', '#00e5ff');
      playBuff();
    } else if (item.type === 'star') {
      weaponBuffTimer = WEAPON_BUFF_DUR;
      spawnFloatText(item.x, item.y, '武器升级！三发散射', '#ffcf5c');
      playBuff();
    }

    spawnParticles(item.x, item.y, DROP_COLOR[item.type], 10);
    playPickup();
    updateHUD();  // ★ 立即刷新血条 UI
  }

  /* ========== 更新 ========== */
  function update(dt) {
    if (!running) return;

    gameTime += dt;
    if (shotCd > 0) shotCd -= dt;

    let buffChanged = false;
    if (weaponBuffTimer > 0) { weaponBuffTimer -= dt; if (weaponBuffTimer <= 0) { weaponBuffTimer = 0; buffChanged = true; } }
    if (speedBuffTimer > 0) { speedBuffTimer -= dt; if (speedBuffTimer <= 0) { speedBuffTimer = 0; buffChanged = true; } }
    if (buffChanged) updateHUD();

    player.speed = speedBuffTimer > 0 ? BASE_SPEED * SPEED_BUFF_MUL : BASE_SPEED;

    // 生成丧尸
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnZombie(); }
    spawnInterval = Math.max(400, 1200 - Math.floor(gameTime / 15000) * 150);

    // 玩家移动
    let mx = 0, my = 0;
    if (keys['w'] || keys['arrowup'])    my -= 1;
    if (keys['s'] || keys['arrowdown'])  my += 1;
    if (keys['a'] || keys['arrowleft'])  mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    if (joyId !== null || Math.abs(joyX) > 0.01 || Math.abs(joyY) > 0.01) { mx = joyX; my = joyY; }

    const mlen = Math.hypot(mx, my);
    if (mlen > 0.01) {
      if (mlen > 1) { mx /= mlen; my /= mlen; }
      player.x += mx * player.speed;
      player.y += my * player.speed;
    }
    player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(H - player.radius, player.y));

    if (fireActive) tryShoot();

    // 子弹
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy; b.life -= 0.012;
      if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20 || b.life <= 0) bullets.splice(i, 1);
    }

    // 丧尸追踪 & 碰撞玩家
    for (let i = zombies.length - 1; i >= 0; i--) {
      const z = zombies[i];
      const dx = player.x - z.x, dy = player.y - z.y;
      const dist = Math.hypot(dx, dy) || 1;
      z.x += dx / dist * z.speed;
      z.y += dy / dist * z.speed;

      if (dist < z.radius + player.radius) {
        player.hp -= 0.6;
        spawnParticles(z.x, z.y, '#ff2f5e', 2);
        updateHUD();
        if (player.hp <= 0) {
          player.hp = 0; updateHUD(); gameOver(); return;
        }
      }
    }

    // 子弹 ↔ 丧尸
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      for (let j = zombies.length - 1; j >= 0; j--) {
        const z = zombies[j];
        const d = Math.hypot(b.x - z.x, b.y - z.y);
        if (d < b.radius + z.radius) {
          bullets.splice(i, 1);
          zombies.splice(j, 1);
          spawnParticles(z.x, z.y, '#7cff5c', 8);
          playZombieDeath();
           kills++;
          tryDrop(z.x, z.y);
          if (kills % 10 === 0) {
            level++;
            speedMultiplier += 0.25;
            playLevelUp();
            for (const zz of zombies) zz.speed = (0.9 + Math.random() * 0.6) * speedMultiplier;
          }
          updateHUD();
          break;
        }
      }
    }

    // ========== 道具：碰撞检测 + 拾取 + 移除 ==========
    // 倒序遍历，保证 splice 安全
    for (let i = items.length - 1; i >= 0; i--) {
      const item = items[i];

      // 倒计时 / 消失
      item.life -= dt / 1000;
      item.bob += 0.12;
      if (item.life <= 0) {
        items.splice(i, 1);
        continue;
      }

      // 计算玩家与道具的距离（用平方距离，避免开方误差）
      const dx = player.x - item.x;
      const dy = player.y - item.y;
      const distSq = dx * dx + dy * dy;

      // 碰到就自动拾取
      if (distSq <= PICKUP_DIST_SQ) {
        pickupItem(item);      // 1. 先结算效果（加血/加速/升级）
        items.splice(i, 1);    // 2. 立即从数组移除，屏幕消失
      }
    }

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= 0.03;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // 飘字（向上飘 + 淡出）
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const f = floatTexts[i];
      f.y += f.vy;
      f.vy *= 0.985;
      f.life -= 0.016;
      if (f.life <= 0) floatTexts.splice(i, 1);
    }
  }

  /* ========== 绘制 ========== */
  function drawGrid() {
    ctx.fillStyle = '#0a0e18';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(0, 229, 255, 0.06)';
    ctx.lineWidth = 1;
    const gridSize = 50;
    ctx.beginPath();
    for (let x = 0; x <= W; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0; y <= H; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    const grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, Math.max(W, H) * 0.75);
    grad.addColorStop(0, 'rgba(0, 80, 120, 0.10)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawPlayer() {
    if (!player) return;
    if (speedBuffTimer > 0) {
      const g2 = ctx.createRadialGradient(player.x, player.y, 2, player.x, player.y, player.radius * 2.6);
      g2.addColorStop(0, 'rgba(0, 229, 255, 0.35)');
      g2.addColorStop(1, 'rgba(0, 229, 255, 0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.radius * 2.6, 0, Math.PI * 2); ctx.fill();
    }
    if (weaponBuffTimer > 0) {
      const g3 = ctx.createRadialGradient(player.x, player.y, 2, player.x, player.y, player.radius * 2.1);
      g3.addColorStop(0, 'rgba(255, 207, 92, 0.35)');
      g3.addColorStop(1, 'rgba(255, 207, 92, 0)');
      ctx.fillStyle = g3;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.radius * 2.1, 0, Math.PI * 2); ctx.fill();
    }
    const g = ctx.createRadialGradient(player.x, player.y, 2, player.x, player.y, player.radius * 1.8);
    g.addColorStop(0, 'rgba(0, 255, 200, 0.25)');
    g.addColorStop(1, 'rgba(0, 255, 200, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius * 1.8, 0, Math.PI * 2); ctx.fill();

    ctx.font = '28px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🤠', player.x, player.y);
  }

  function drawZombies() {
    ctx.font = '26px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const z of zombies) {
      const g = ctx.createRadialGradient(z.x, z.y, 1, z.x, z.y, z.radius * 1.8);
      g.addColorStop(0, 'rgba(255, 47, 94, 0.28)');
      g.addColorStop(1, 'rgba(255, 47, 94, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.radius * 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillText('🧟‍♂️', z.x, z.y);
    }
  }

  function drawBullets() {
    for (const b of bullets) {
      ctx.save();
      ctx.shadowColor = '#00ffe0';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#b3fff0';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawItems() {
    ctx.font = '24px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const item of items) {
      const bobY = Math.sin(item.bob) * 4;
      const col = DROP_COLOR[item.type];

      ctx.save();
      ctx.shadowColor = col;
      ctx.shadowBlur = 18;
      ctx.fillText(DROP_EMOJI[item.type], item.x, item.y + bobY);
      ctx.restore();

      // 剩余时间圈
      const lifePct = Math.max(0, Math.min(1, item.life / 12));
      ctx.save();
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(item.x, item.y, item.radius + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * lifePct);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * Math.max(0, p.life), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloatTexts() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const f of floatTexts) {
      const alpha = Math.max(0, Math.min(1, f.life));
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = 'bold 15px monospace';
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 14;
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
      ctx.shadowBlur = 0;
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(0,0,0,' + alpha + ')';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.restore();
    }
  }

  function drawCrosshair() {
    if (!player) return;
    if (!isTouch) {
      ctx.save();
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.22)';
      ctx.lineWidth = 1;
      ctx.setLineDash([5, 8]);
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(mouseX, mouseY);
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 110, 199, 0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mouseX, mouseY, 9, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function render() {
    drawGrid();
    drawItems();
    drawZombies();
    drawBullets();
    drawPlayer();
    drawParticles();
    drawFloatTexts();
    drawCrosshair();
  }

  /* ========== 结束 ========== */
  function gameOver() {
    running = false;
    const score = kills;
    const isNewRecord = score > highScore;
    if (isNewRecord) {
      highScore = score;
      try { localStorage.setItem(HS_KEY, String(highScore)); } catch (e) {}
    }
    hudHighScore.textContent = highScore;
    finalScore.textContent = score;
    finalHighScore.textContent = highScore;
    newRecordText.style.display = isNewRecord ? 'block' : 'none';
    gameOverScreen.classList.add('active');
  }

  /* ========== 主循环 ========== */
  function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) lastTime = now;
    let dt = now - lastTime;
    lastTime = now;
    if (dt > 100) dt = 100;
    if (running) update(dt);
    render();
  }

  /* ========== 重开 ========== */
  let restartLock = false;
  function restartGame() {
    if (restartLock) return;
    restartLock = true;
    gameOverScreen.classList.remove('active');
    resetGame();
    setTimeout(() => { restartLock = false; }, 300);
  }
  restartBtn.addEventListener('click', e => { e.preventDefault(); restartGame(); });
  restartBtn.addEventListener('touchend', e => { e.preventDefault(); restartGame(); }, { passive: false });

  /* ========== 启动 ========== */
  resetGame();
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
