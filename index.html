<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>丧尸生存 · Zombie Survival</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #05060a;
    overflow: hidden;
    touch-action: none;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 450px; height: 800px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 9 / 16;
    background: #0a0d14;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0, 255, 200, 0.08), 0 0 120px rgba(255, 0, 80, 0.06);
  }
  @media (max-aspect-ratio: 9/16) {
    #stage { width: 100vw; height: calc(100vw * 16 / 9); }
  }
  @media (min-aspect-ratio: 9/16) {
    #stage { height: 100vh; width: calc(100vh * 9 / 16); }
  }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 12px;
    pointer-events: none;
    z-index: 10;
  }
  .hud-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #hpBarWrap {
    flex: 1;
    height: 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(0,255,200,0.35);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
  }
  #hpBarFill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff2d55, #ff9500, #00ffc8);
    background-size: 200% 100%;
    transition: width 0.15s linear;
    box-shadow: 0 0 12px rgba(0,255,200,0.5);
  }
  #killCount {
    font-size: 15px; font-weight: 700;
    color: #00ffc8;
    text-shadow: 0 0 8px rgba(0,255,200,0.8);
    white-space: nowrap;
  }
  #difficultyDisplay {
    font-size: 13px; font-weight: 700;
    color: #ff9500;
    text-shadow: 0 0 8px rgba(255,149,0,0.8);
    white-space: nowrap;
  }
  #hudHighScore {
    font-size: 12px; color: #8fa3b8;
    text-shadow: 0 0 6px rgba(143,163,184,0.5);
    white-space: nowrap;
  }
  .hud-sub { margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }

  #buffRow { display: flex; gap: 8px; margin-top: 6px; }
  .buff-icon {
    font-size: 18px; opacity: 0; transform: scale(0.6);
    transition: opacity 0.2s, transform 0.2s;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.7));
  }
  .buff-icon.on { opacity: 1; transform: scale(1); }

  #bossBarWrap {
    position: absolute; top: 78px; left: 50%;
    transform: translateX(-50%);
    width: 78%; height: 14px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,45,85,0.7);
    border-radius: 7px;
    overflow: hidden;
    display: none;
    z-index: 11;
    box-shadow: 0 0 16px rgba(255,45,85,0.5);
  }
  #bossBarFill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff2d55, #ff6b00);
    transition: width 0.1s linear;
  }
  #bossWarning {
    position: absolute; top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    font-size: 34px; font-weight: 900;
    color: #ff2d55;
    text-shadow: 0 0 20px rgba(255,45,85,0.9), 0 0 40px rgba(255,45,85,0.6);
    letter-spacing: 4px;
    opacity: 0;
    pointer-events: none;
    z-index: 12;
    white-space: nowrap;
  }
  #bossWarning.show { animation: warnPulse 1.6s ease-out forwards; }
  @keyframes warnPulse {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
    40% { transform: translate(-50%,-50%) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.2); }
  }

  #touchControls {
    position: absolute; inset: 0;
    display: none;
    z-index: 20;
    pointer-events: none;
  }
  #touchControls.active { display: block; }
  #joystick {
    position: absolute; left: 26px; bottom: 34px;
    width: 130px; height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,200,0.10), rgba(0,255,200,0.03));
    border: 2px solid rgba(0,255,200,0.35);
    pointer-events: auto;
    box-shadow: 0 0 20px rgba(0,255,200,0.15);
  }
  #joystickKnob {
    position: absolute; left: 50%; top: 50%;
    width: 56px; height: 56px;
    margin-left: -28px; margin-top: -28px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,200,0.55), rgba(0,255,200,0.2));
    border: 2px solid rgba(0,255,200,0.8);
    box-shadow: 0 0 16px rgba(0,255,200,0.6);
  }
  #fireButton {
    position: absolute; right: 30px; bottom: 44px;
    width: 108px; height: 108px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,45,85,0.35), rgba(255,45,85,0.12));
    border: 3px solid rgba(255,45,85,0.8);
    color: #ff2d55;
    font-size: 17px; font-weight: 900;
    letter-spacing: 2px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
    box-shadow: 0 0 24px rgba(255,45,85,0.4);
    text-shadow: 0 0 10px rgba(255,45,85,0.9);
  }
  #fireButton:active { background: radial-gradient(circle, rgba(255,45,85,0.6), rgba(255,45,85,0.25)); }

  #gameOverScreen {
    position: absolute; inset: 0;
    background: rgba(5,6,10,0.92);
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 30;
    padding: 30px;
    text-align: center;
  }
  #gameOverScreen.show { display: flex; }
  #gameOverScreen h1 {
    font-size: 40px; font-weight: 900;
    color: #ff2d55;
    text-shadow: 0 0 24px rgba(255,45,85,0.9);
    letter-spacing: 6px;
    margin-bottom: 26px;
  }
  .score-line {
    font-size: 17px; color: #8fa3b8;
    margin: 8px 0;
    letter-spacing: 1px;
  }
  .score-line b {
    color: #00ffc8;
    font-size: 26px;
    text-shadow: 0 0 14px rgba(0,255,200,0.8);
    margin-left: 6px;
  }
  #finalHighScore { color: #ffd700; text-shadow: 0 0 14px rgba(255,215,0,0.8); }
  #newRecordText {
    font-size: 18px; font-weight: 800;
    color: #ffd700;
    text-shadow: 0 0 16px rgba(255,215,0,0.9);
    margin: 14px 0;
    display: none;
    animation: blink 0.9s infinite alternate;
  }
  #newRecordText.show { display: block; }
  @keyframes blink { from { opacity: 1; } to { opacity: 0.4; } }
  #restartBtn {
    margin-top: 30px;
    padding: 15px 52px;
    font-size: 20px; font-weight: 800;
    letter-spacing: 3px;
    color: #05060a;
    background: linear-gradient(135deg, #00ffc8, #00b3ff);
    border: none; border-radius: 40px;
    box-shadow: 0 0 26px rgba(0,255,200,0.6);
    cursor: pointer;
    pointer-events: auto;
  }
  #restartBtn:active { transform: scale(0.96); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gameCanvas" width="450" height="800"></canvas>

  <div id="hud">
    <div class="hud-row">
      <div id="hpBarWrap"><div id="hpBarFill"></div></div>
      <div id="killCount">击杀 0</div>
    </div>
    <div class="hud-sub">
      <div id="difficultyDisplay">难度 Lv.1</div>
      <div id="hudHighScore">最高分 0</div>
    </div>
    <div id="buffRow">
      <div class="buff-icon" id="buffWeapon">🌟</div>
      <div class="buff-icon" id="buffSpeed">⚡</div>
    </div>
  </div>

  <div id="bossBarWrap"><div id="bossBarFill"></div></div>
  <div id="bossWarning">⚠ BOSS 来袭 ⚠</div>

  <div id="touchControls">
    <div id="joystick"><div id="joystickKnob"></div></div>
    <div id="fireButton">FIRE</div>
  </div>

  <div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <div class="score-line">本局得分<b id="finalScore">0</b></div>
    <div class="score-line">最高分<b id="finalHighScore">0</b></div>
    <div id="newRecordText">🎉 新纪录！</div>
    <button id="restartBtn">重新开始</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ==================== 基础常量 ====================
  const W = 450, H = 800;
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const PLAYER_RADIUS = 18;
  const ITEM_RADIUS = 15;
  const PICKUP_DIST_SQ = (PLAYER_RADIUS + ITEM_RADIUS) * (PLAYER_RADIUS + ITEM_RADIUS);

  const BASE_SPEED = 4.5;
  const SPEED_BUFF_MUL = 1.7;
  const SPEED_BUFF_DUR = 5000;

  const SHOT_CD = 180;
  const SHOT_CD_BUFF = 110;
  const WEAPON_BUFF_DUR = 10000;

  const HEAL_AMOUNT = 20;

  const BOSS_MAX_HP = 50;
  const BOSS_RADIUS = 48;
  const BOSS_SPEED = 0.55;
  const BOSS_SHOOT_INTERVAL = 1800;

  const HIGHSCORE_KEY = 'zombie_survival_highscore';

  // ==================== 游戏状态 ====================
  let running = false;
  let gameTime = 0;
  let kills = 0;
  let difficultyLevel = 1;
  let speedMultiplier = 1;
  let spawnInterval = 1200;
  let spawnTimer = 0;
  let lastTimeLevel = 0;
  let lastKillLevel = 0;
  let bossSpawned = false;
  let boss = null;
  let bossShootTimer = 0;
  let highScore = 0;

  let player = null;
  let zombies = [];
  let bullets = [];
  let bossBullets = [];
  let items = [];
  let particles = [];
  let floatTexts = [];

  let aimAngle = -Math.PI / 2;
  let shotTimer = 0;
  let weaponBuffTimer = 0;
  let speedBuffTimer = 0;

  let fireActive = false;
  const keys = {};

  let joyId = null;
  let fireId = null;
  let joyVec = { x: 0, y: 0 };
  let restartLock = false;

  // ==================== 音效 ====================
  let audioCtx = null;
  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { audioCtx = null; }
  }
  function beep(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = vol == null ? 0.06 : vol;
      o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  function playShoot() { beep(680, 0.06, 'square', 0.05); }
  function playZombieDeath() { beep(160, 0.14, 'sawtooth', 0.06); }
  function playPickup() { beep(880, 0.08, 'sine', 0.08); setTimeout(() => beep(1180, 0.08, 'sine', 0.07), 70); }
  function playLevelUp() { beep(520, 0.1, 'triangle', 0.08); setTimeout(() => beep(780, 0.14, 'triangle', 0.08), 100); }
  function playBuff() { beep(1000, 0.07, 'sine', 0.07); setTimeout(() => beep(1400, 0.1, 'sine', 0.06), 60); }
  function playBossShoot() { beep(220, 0.12, 'sawtooth', 0.07); }
  function playBossHurt() { beep(300, 0.05, 'square', 0.05); }
  function playBossDie() {
    beep(200, 0.2, 'sawtooth', 0.09);
    setTimeout(() => beep(140, 0.3, 'sawtooth', 0.09), 160);
    setTimeout(() => beep(90, 0.5, 'sawtooth', 0.09), 380);
  }
  function playBossWarning() {
    beep(180, 0.25, 'sawtooth', 0.08);
    setTimeout(() => beep(180, 0.25, 'sawtooth', 0.08), 320);
  }

  // ==================== 工具 ====================
  function rand(a, b) { return a + Math.random() * (b - a); }
  function distSq(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }

  function addFloatText(x, y, text, color) {
    floatTexts.push({ x, y, text, color: color || '#fff', life: 1, vy: -0.8 });
  }
  function addParticles(x, y, color, count) {
    for (let i = 0; i < (count || 8); i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(1, 4);
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        color: color || '#ff2d55',
        size: rand(2, 5)
      });
    }
  }

  // ==================== 初始化 / 重置 ====================
  function resetGame() {
    running = true;
    gameTime = 0;
    kills = 0;
    difficultyLevel = 1;
    speedMultiplier = 1;
    spawnInterval = 1200;
    spawnTimer = 0;
    lastTimeLevel = 0;
    lastKillLevel = 0;
    bossSpawned = false;
    boss = null;
    bossShootTimer = 0;

    player = { x: W / 2, y: H / 2, hp: 100, maxHp: 100 };

    zombies = [];
    bullets = [];
    bossBullets = [];
    items = [];
    particles = [];
    floatTexts = [];

    aimAngle = -Math.PI / 2;
    shotTimer = 0;
    weaponBuffTimer = 0;
    speedBuffTimer = 0;
    fireActive = false;
    joyVec = { x: 0, y: 0 };

    for (let i = 0; i < 3; i++) spawnZombie();

    document.getElementById('gameOverScreen').classList.remove('show');
    document.getElementById('bossBarWrap').style.display = 'none';
    document.getElementById('buffWeapon').classList.remove('on');
    document.getElementById('buffSpeed').classList.remove('on');

    highScore = parseInt(localStorage.getItem(HIGHSCORE_KEY) || '0', 10) || 0;
    updateHUD();
  }

  // ==================== 丧尸 ====================
  function spawnZombie() {
    let x, y, tries = 0;
    do {
      const edge = Math.floor(Math.random() * 4);
      if (edge === 0) { x = rand(0, W); y = -30; }
      else if (edge === 1) { x = W + 30; y = rand(0, H); }
      else if (edge === 2) { x = rand(0, W); y = H + 30; }
      else { x = -30; y = rand(0, H); }
      tries++;
    } while (distSq(x, y, player.x, player.y) < 200 * 200 && tries < 10);

    zombies.push({
      x, y,
      radius: 16,
      speed: (0.9 + Math.random() * 0.6) * speedMultiplier,
      hp: 1,
      wobble: Math.random() * Math.PI * 2
    });
  }

  function spawnBoss() {
    boss = {
      x: W / 2, y: -80,
      radius: BOSS_RADIUS,
      hp: BOSS_MAX_HP,
      maxHp: BOSS_MAX_HP,
      speed: BOSS_SPEED,
      wobble: 0
    };
    bossShootTimer = 0;
    document.getElementById('bossBarWrap').style.display = 'block';
    document.getElementById('bossBarFill').style.width = '100%';

    const warn = document.getElementById('bossWarning');
    warn.classList.remove('show');
    void warn.offsetWidth;
    warn.classList.add('show');
    playBossWarning();
  }

  function increaseDifficulty() {
    difficultyLevel++;
    speedMultiplier += 0.10;
    spawnInterval = Math.max(350, spawnInterval * 0.90);
    playLevelUp();
    addFloatText(W / 2, 120, '难度提升 Lv.' + difficultyLevel, '#ff9500');

    if (difficultyLevel >= 5 && !bossSpawned) {
      bossSpawned = true;
      spawnBoss();
    }
  }

  // ==================== 射击 ====================
  function tryShoot() {
    if (!running) return;
    if (player.hp <= 0) return;
    if (shotTimer > 0) return;

    const cd = weaponBuffTimer > 0 ? SHOT_CD_BUFF : SHOT_CD;
    shotTimer = cd;

    let target = null, bestD = Infinity;
    if (boss) {
      target = boss;
    } else {
      for (let i = 0; i < zombies.length; i++) {
        const d = distSq(zombies[i].x, zombies[i].y, player.x, player.y);
        if (d < bestD) { bestD = d; target = zombies[i]; }
      }
    }
    if (target) {
      aimAngle = Math.atan2(target.y - player.y, target.x - player.x);
    }

    const speed = 11;
    const spread = 0.16;

    if (weaponBuffTimer > 0) {
      for (let k = -1; k <= 1; k++) {
        const a = aimAngle + k * spread;
        bullets.push({
          x: player.x + Math.cos(a) * PLAYER_RADIUS,
          y: player.y + Math.sin(a) * PLAYER_RADIUS,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed,
          radius: 4, life: 2
        });
      }
    } else {
      bullets.push({
        x: player.x + Math.cos(aimAngle) * PLAYER_RADIUS,
        y: player.y + Math.sin(aimAngle) * PLAYER_RADIUS,
        vx: Math.cos(aimAngle) * speed,
        vy: Math.sin(aimAngle) * speed,
        radius: 4, life: 2
      });
    }
    playShoot();
  }

  // ==================== 掉落 ====================
  function tryDrop(x, y) {
    if (Math.random() >= 0.15) return;
    const r = Math.random();
    let type;
    if (r < 0.4) type = 'heart';
    else if (r < 0.7) type = 'lightning';
    else type = 'star';

    items.push({
      x, y, type,
      radius: ITEM_RADIUS,
      life: 12,
      bob: Math.random() * Math.PI * 2
    });
  }

  function pickupItem(item) {
    if (item.type === 'heart') {
      player.hp = Math.min(player.hp + HEAL_AMOUNT, player.maxHp);
      addFloatText(item.x, item.y, '+' + HEAL_AMOUNT + ' HP', '#ff2d55');
      playPickup();
    } else if (item.type === 'lightning') {
      speedBuffTimer = SPEED_BUFF_DUR;
      addFloatText(item.x, item.y, '加速!', '#00b3ff');
      playBuff();
    } else if (item.type === 'star') {
      weaponBuffTimer = WEAPON_BUFF_DUR;
      addFloatText(item.x, item.y, '武器升级!', '#ffd700');
      playBuff();
    }
    addParticles(item.x, item.y, '#00ffc8', 10);
  }

  // ==================== BOSS 击杀 ====================
  function killBoss() {
    if (!boss) return;
    const bx = boss.x, by = boss.y;
    boss = null;
    bossBullets = [];
    kills += 10;
    document.getElementById('bossBarWrap').style.display = 'none';
    addParticles(bx, by, '#ff2d55', 40);
    addParticles(bx, by, '#ffd700', 30);
    addFloatText(bx, by, 'BOSS 击杀!', '#ffd700');
    playBossDie();
  }

  // ==================== 更新 ====================
  function update(dt) {
    if (!running) return;

    gameTime += dt;

    const timeLevel = Math.floor(gameTime / 30000);
    if (timeLevel > lastTimeLevel) {
      lastTimeLevel = timeLevel;
      increaseDifficulty();
    }
    const killLevel = Math.floor(kills / 20);
    if (killLevel > lastKillLevel) {
      lastKillLevel = killLevel;
      increaseDifficulty();
    }

    if (shotTimer > 0) shotTimer -= dt;
    if (weaponBuffTimer > 0) weaponBuffTimer -= dt;
    if (speedBuffTimer > 0) speedBuffTimer -= dt;

    let mx = 0, my = 0;
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    mx += joyVec.x;
    my += joyVec.y;

    const mag = Math.hypot(mx, my);
    if (mag > 1) { mx /= mag; my /= mag; }

    const spd = BASE_SPEED * (speedBuffTimer > 0 ? SPEED_BUFF_MUL : 1);
    player.x += mx * spd;
    player.y += my * spd;
    player.x = Math.max(PLAYER_RADIUS, Math.min(W - PLAYER_RADIUS, player.x));
    player.y = Math.max(PLAYER_RADIUS, Math.min(H - PLAYER_RADIUS, player.y));

    if (fireActive || keys[' ']) tryShoot();

    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnZombie();
    }

    for (let i = zombies.length - 1; i >= 0; i--) {
      const z = zombies[i];
      const dx = player.x - z.x, dy = player.y - z.y;
      const d = Math.hypot(dx, dy) || 1;
      z.x += (dx / d) * z.speed;
      z.y += (dy / d) * z.speed;
      z.wobble += 0.15;

      if (distSq(z.x, z.y, player.x, player.y) < (z.radius + PLAYER_RADIUS) * (z.radius + PLAYER_RADIUS)) {
        player.hp -= 0.6;
      }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      b.life -= dt / 1000;
      if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
        bullets.splice(i, 1);
        continue;
      }
      let hit = false;
      for (let j = zombies.length - 1; j >= 0; j--) {
        const z = zombies[j];
        if (distSq(b.x, b.y, z.x, z.y) < (z.radius + b.radius) * (z.radius + b.radius)) {
          z.hp--;
          hit = true;
          if (z.hp <= 0) {
            addParticles(z.x, z.y, '#7fff00', 10);
            tryDrop(z.x, z.y);
            zombies.splice(j, 1);
            kills++;
            playZombieDeath();
          }
          break;
        }
      }
      if (!hit && boss) {
        if (distSq(b.x, b.y, boss.x, boss.y) < (boss.radius + b.radius) * (boss.radius + b.radius)) {
          boss.hp--;
          hit = true;
          playBossHurt();
          addParticles(b.x, b.y, '#ff2d55', 4);
          document.getElementById('bossBarFill').style.width =
            Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
          if (boss.hp <= 0) killBoss();
        }
      }
      if (hit) bullets.splice(i, 1);
    }

    if (boss) {
      const dx = player.x - boss.x, dy = player.y - boss.y;
      const d = Math.hypot(dx, dy) || 1;
      boss.x += (dx / d) * boss.speed;
      boss.y += (dy / d) * boss.speed;
      boss.wobble += 0.08;

      if (distSq(boss.x, boss.y, player.x, player.y) < (boss.radius + PLAYER_RADIUS) * (boss.radius + PLAYER_RADIUS)) {
        player.hp -= 1.2;
      }

      bossShootTimer += dt;
      if (bossShootTimer >= BOSS_SHOOT_INTERVAL) {
        bossShootTimer = 0;
        const a = Math.atan2(player.y - boss.y, player.x - boss.x);
        bossBullets.push({
          x: boss.x, y: boss.y,
          vx: Math.cos(a) * 2.6,
          vy: Math.sin(a) * 2.6,
          radius: 9, life: 6
        });
        playBossShoot();
      }
    }

    for (let i = bossBullets.length - 1; i >= 0; i--) {
      const bb = bossBullets[i];
      bb.x += bb.vx;
      bb.y += bb.vy;
      bb.life -= dt / 1000;
      if (bb.life <= 0 || bb.x < -30 || bb.x > W + 30 || bb.y < -30 || bb.y > H + 30) {
        bossBullets.splice(i, 1);
        continue;
      }
      if (distSq(bb.x, bb.y, player.x, player.y) < (bb.radius + PLAYER_RADIUS) * (bb.radius + PLAYER_RADIUS)) {
        player.hp -= 12;
        addParticles(bb.x, bb.y, '#ff2d55', 8);
        bossBullets.splice(i, 1);
      }
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.life -= dt / 1000;
      it.bob += 0.1;
      if (it.life <= 0) { items.splice(i, 1); continue; }
      if (distSq(it.x, it.y, player.x, player.y) < PICKUP_DIST_SQ) {
        pickupItem(it);
        items.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.life -= dt / 600;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const f = floatTexts[i];
      f.y += f.vy;
      f.life -= dt / 900;
      if (f.life <= 0) floatTexts.splice(i, 1);
    }

    if (player.hp <= 0) {
      player.hp = 0;
      gameOver();
    }

    updateHUD();
  }

  // ==================== HUD ====================
  function updateHUD() {
    document.getElementById('hpBarFill').style.width =
      Math.max(0, (player.hp / player.maxHp) * 100) + '%';
    document.getElementById('killCount').textContent = '击杀 ' + kills;
    document.getElementById('difficultyDisplay').textContent = '难度 Lv.' + difficultyLevel;
    document.getElementById('hudHighScore').textContent = '最高分 ' + highScore;
    document.getElementById('buffWeapon').classList.toggle('on', weaponBuffTimer > 0);
    document.getElementById('buffSpeed').classList.toggle('on', speedBuffTimer > 0);
  }

  // ==================== 渲染 ====================
  function drawGrid() {
    ctx.fillStyle = '#0a0d14';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(0, 255, 200, 0.06)';
    ctx.lineWidth = 1;
    const gs = 45;
    ctx.beginPath();
    for (let x = 0; x <= W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0; y <= H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  }

  function drawItems() {
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const bobY = Math.sin(it.bob) * 4;
            const glow = ctx.createRadialGradient(it.x, it.y + bobY, 0, it.x, it.y + bobY, 26);
      let c = 'rgba(255,45,85,0.5)';
      if (it.type === 'lightning') c = 'rgba(0,179,255,0.5)';
      if (it.type === 'star') c = 'rgba(255,215,0,0.5)';
      glow.addColorStop(0, c);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(it.x, it.y + bobY, 26, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = '26px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      let emoji = '❤️';
      if (it.type === 'lightning') emoji = '⚡';
      if (it.type === 'star') emoji = '🌟';
      ctx.fillText(emoji, it.x, it.y + bobY);
    }
  }

  function drawZombies() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < zombies.length; i++) {
      const z = zombies[i];
      const wob = Math.sin(z.wobble) * 3;
      ctx.font = '32px serif';
      ctx.fillText('🧟‍♂️', z.x, z.y + wob);
    }
  }

  function drawBoss() {
    if (!boss) return;
    const wob = Math.sin(boss.wobble) * 5;
    const glow = ctx.createRadialGradient(boss.x, boss.y, 0, boss.x, boss.y, boss.radius * 1.8);
    glow.addColorStop(0, 'rgba(255,45,85,0.35)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(boss.x, boss.y, boss.radius * 1.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '96px serif';
    ctx.fillText('🧟', boss.x, boss.y + wob);
  }

  function drawBullets() {
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      ctx.fillStyle = '#00ffc8';
      ctx.shadowColor = '#00ffc8';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawBossBullets() {
    for (let i = 0; i < bossBullets.length; i++) {
      const bb = bossBullets[i];
      ctx.fillStyle = '#ff2d55';
      ctx.shadowColor = '#ff2d55';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(bb.x, bb.y, bb.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawPlayer() {
    if (speedBuffTimer > 0) {
      ctx.strokeStyle = 'rgba(0,179,255,0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_RADIUS + 8, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (weaponBuffTimer > 0) {
      ctx.strokeStyle = 'rgba(255,215,0,0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_RADIUS + 13, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '36px serif';
    ctx.fillText('🤠', player.x, player.y);
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloatTexts() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < floatTexts.length; i++) {
      const f = floatTexts[i];
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.font = 'bold 18px "Segoe UI", sans-serif';
      ctx.fillStyle = f.color;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 8;
      ctx.fillText(f.text, f.x, f.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  function drawCrosshair() {
    const cx = player.x + Math.cos(aimAngle) * 60;
    const cy = player.y + Math.sin(aimAngle) * 60;
    ctx.strokeStyle = 'rgba(0,255,200,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy); ctx.lineTo(cx - 4, cy);
    ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + 12, cy);
    ctx.moveTo(cx, cy - 12); ctx.lineTo(cx, cy - 4);
    ctx.moveTo(cx, cy + 4); ctx.lineTo(cx, cy + 12);
    ctx.stroke();
  }

  function render() {
    drawGrid();
    drawItems();
    drawZombies();
    drawBoss();
    drawBullets();
    drawBossBullets();
    drawPlayer();
    drawParticles();
    drawFloatTexts();
    drawCrosshair();
  }

  // ==================== 主循环 ====================
  let lastTime = 0;
  function loop(now) {
    if (!lastTime) lastTime = now;
    let dt = now - lastTime;
    lastTime = now;
    if (dt > 100) dt = 100;

    if (running) update(dt);
    render();

    requestAnimationFrame(loop);
  }

  // ==================== 游戏结束 ====================
  function gameOver() {
    if (!running) return;
    running = false;

    const score = kills;
    const isNew = score > highScore;
    if (isNew) {
      highScore = score;
      localStorage.setItem(HIGHSCORE_KEY, String(highScore));
    }

    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalHighScore').textContent = highScore;
    document.getElementById('newRecordText').classList.toggle('show', isNew);
    document.getElementById('gameOverScreen').classList.add('show');
  }

  function restartGame() {
    if (restartLock) return;
    restartLock = true;
    setTimeout(() => { restartLock = false; }, 300);
    initAudio();
    resetGame();
  }

  // ==================== 输入：键盘 ====================
  window.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    const k = e.key.toLowerCase();
    keys[k] = false;
  });

  // ==================== 输入：鼠标 ====================
  canvas.addEventListener('mousemove', function (e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    aimAngle = Math.atan2(my - player.y, mx - player.x);
  });
  canvas.addEventListener('mousedown', function (e) {
    if (e.button === 0) fireActive = true;
  });
  window.addEventListener('mouseup', function (e) {
    if (e.button === 0) fireActive = false;
  });

  // ==================== 输入：触屏 ====================
  const joystick = document.getElementById('joystick');
  const joystickKnob = document.getElementById('joystickKnob');
  const fireButton = document.getElementById('fireButton');

  function joyCenter() {
    const r = joystick.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 };
  }

  function handleJoyMove(clientX, clientY) {
    const c = joyCenter();
    let dx = clientX - c.x;
    let dy = clientY - c.y;
    const maxR = c.r - 20;
    const d = Math.hypot(dx, dy);
    if (d > maxR) { dx = dx / d * maxR; dy = dy / d * maxR; }
    joystickKnob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    joyVec.x = dx / maxR;
    joyVec.y = dy / maxR;
  }

  function resetJoy() {
    joystickKnob.style.transform = 'translate(0,0)';
    joyVec.x = 0;
    joyVec.y = 0;
    joyId = null;
  }

  joystick.addEventListener('touchstart', function (e) {
    e.preventDefault();
    const t = e.changedTouches[0];
    joyId = t.identifier;
    handleJoyMove(t.clientX, t.clientY);
  }, { passive: false });

  fireButton.addEventListener('touchstart', function (e) {
    e.preventDefault();
    const t = e.changedTouches[0];
    fireId = t.identifier;
    fireActive = true;
  }, { passive: false });

  window.addEventListener('touchmove', function (e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joyId) {
        e.preventDefault();
        handleJoyMove(t.clientX, t.clientY);
      }
    }
  }, { passive: false });

  window.addEventListener('touchend', function (e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joyId) resetJoy();
      if (t.identifier === fireId) { fireActive = false; fireId = null; }
    }
  }, { passive: false });

  window.addEventListener('touchcancel', function (e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joyId) resetJoy();
      if (t.identifier === fireId) { fireActive = false; fireId = null; }
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  // ==================== 重启按钮 ====================
  const restartBtn = document.getElementById('restartBtn');
  restartBtn.addEventListener('click', restartGame);
  restartBtn.addEventListener('touchend', function (e) {
    e.preventDefault();
    restartGame();
  }, { passive: false });

  // ==================== 设备检测 ====================
  if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
    document.getElementById('touchControls').classList.add('active');
  }

  // ==================== 启动 ====================
  initAudio();
  resetGame();
  requestAnimationFrame(loop);

})();
</script>
</body>
