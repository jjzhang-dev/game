<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>暗夜尸潮 · 极简竖屏版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: 'Courier New', monospace;
    }
    /* 居中容器 */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    /* 画布：固定竖屏比例，高度自动撑满（居中留黑边） */
    #gameCanvas {
      display: block;
      background: #14181c;
      box-shadow: 0 0 20px #8b0000;
    }
    /* HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hud-top {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      background: rgba(20,24,28,0.85);
      border-radius: 30px;
      border: 1px solid #5e3737;
      color: #c0b9b0;
      font-weight: bold;
      font-size: 0.75rem;
      white-space: nowrap;
      pointer-events: auto;
    }
    .hp-fill {
      width: 70px;
      height: 10px;
      background: #2b1e1e;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #5e3737;
    }
    .hp-fill span {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #b30000, #e63946);
      transition: width 0.15s;
    }
    .stat { color: #d4af37; }
    .stat.level { color: #c084fc; }
    #restartBtn {
      background: #1e1212;
      border: 1px solid #6b3a3a;
      color: #ddbbbb;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 30px;
      font-family: inherit;
      font-size: 0.7rem;
      pointer-events: auto;
    }
    /* 触屏控件 */
    #touchControls {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 130px;
      display: none;
      pointer-events: none;
    }
    #touchControls.active { display: block; }
    #joystick {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(60,80,90,0.3);
      border: 2px solid rgba(120,160,180,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      touch-action: none;
    }
    #joystickKnob {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #9bc4d4, #3a5a6a);
      border: 2px solid #7fb0c4;
      will-change: transform;
    }
    #fireButton {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #d94a4a, #7a1010);
      border: 3px solid #e77;
      box-shadow: 0 0 18px rgba(230,50,50,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      pointer-events: auto;
      touch-action: none;
      transition: transform 0.05s;
    }
    #fireButton.pressed { transform: scale(0.9); }
  </style>
</head>
<body>

<div id="stage">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-top">
      <div style="display:flex;align-items:center;gap:4px;">
        <span>❤️</span>
        <div class="hp-fill"><span id="hpBarFill" style="width:100%"></span></div>
      </div>
      <div class="stat">🔫<span id="killCount">0</span></div>
      <div class="stat level">⭐<span id="levelDisplay">1</span></div>
      <button id="restartBtn">⟲</button>
    </div>
  </div>
  <div id="touchControls">
    <div id="joystick"><div id="joystickKnob"></div></div>
    <div id="fireButton">🔫</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ============ 固定竖屏逻辑尺寸 (9:16) ============
  const W = 450;
  const H = 800;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = W;
  canvas.height = H;

  // ============ 让画布按比例居中显示（用 CSS，不用复杂计算） ============
  function fitCanvas() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    // 保持 9:16 比例，取较小的缩放
    const scaleW = vw / W;
    const scaleH = vh / H;
    const scale = Math.min(scaleW, scaleH);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  fitCanvas();

  // ============ DOM ============
  const hpBarFill = document.getElementById('hpBarFill');
  const killCountSpan = document.getElementById('killCount');
  const levelDisplay = document.getElementById('levelDisplay');
  const restartBtn = document.getElementById('restartBtn');
  const touchControls = document.getElementById('touchControls');
  const joystick = document.getElementById('joystick');
  const joystickKnob = document.getElementById('joystickKnob');
  const fireButton = document.getElementById('fireButton');

  // ============ 设备检测 ============
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) touchControls.classList.add('active');

  // ============ 游戏状态 ============
  let gameActive = true;
  let player = { x: W/2, y: H - 80, radius: 18, speed: 4.5, hp: 100, maxHp: 100 };

  let inputX = 0, inputY = 0;

  let zombies = [];
  let bullets = [];
  let pickups = [];

  let killCount = 0, currentLevel = 1, speedMultiplier = 1.0;
  let lastSpawn = 0, spawnInterval = 1200, lastTs = 0;
  let lastShot = 0;
  const SHOT_CD = 180;

  let fireHeld = false, mouseDown = false;
  let keys = { w:false, a:false, s:false, d:false, up:false, down:false, left:false, right:false };
  let aimAngle = -Math.PI/2;
  let mouse = { x: W/2, y: 100 };
  let mouseActive = false;

  let hasShotgun = false, shotgunTimer = 0;
  const SHOTGUN_DUR = 8000;

  function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }
  function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1, y2-y1); }

  // ============ 音效（简单） ============
  let actx = null;
  function initAudio() {
    if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function beep(freq, dur, type, vol) {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.1, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }

  // ============ 重置 ============
  function reset() {
    gameActive = true;
    player = { x: W/2, y: H - 80, radius: 18, speed: 4.5, hp: 100, maxHp: 100 };
    zombies = []; bullets = []; pickups = [];
    killCount = 0; currentLevel = 1; speedMultiplier = 1.0;
    killCountSpan.textContent = '0';
    levelDisplay.textContent = '1';
    hpBarFill.style.width = '100%';
    lastSpawn = 0; spawnInterval = 1200;
    hasShotgun = false; shotgunTimer = 0;
    inputX = 0; inputY = 0; fireHeld = false; mouseDown = false;
    aimAngle = -Math.PI/2; mouseActive = false;
    joystickKnob.style.transform = 'translate(0,0)';
    keys.w = keys.a = keys.s = keys.d = false;
    keys.up = keys.down = keys.left = keys.right = false;
    for (let i = 0; i < 3; i++) spawnZombie();
    draw();
  }

  function updateHp() {
    hpBarFill.style.width = Math.max(0, (player.hp/player.maxHp)*100) + '%';
  }

  // ============ 生成丧尸（从上方/两侧） ============
  function spawnZombie() {
    let x, y;
    const r = Math.random();
    if (r < 0.7) { x = Math.random()*W; y = -30; }
    else if (r < 0.85) { x = -30; y = Math.random()*(H*0.5); }
    else { x = W+30; y = Math.random()*(H*0.5); }
    const base = 0.7 + Math.random()*0.5;
    zombies.push({
      x, y, radius: 16,
      speed: base*speedMultiplier, baseSpeed: base,
      hp: 1, flash: 0, wobble: Math.random()*6.28, phase: Math.random()*10
    });
  }

  // ============ 射击（自动瞄准最近丧尸） ============
  function shoot(now) {
    if (!gameActive) return;
    if (now - lastShot < SHOT_CD) return;
    lastShot = now;
    beep(320, 0.05, 'square', 0.08);

    let angle = aimAngle;
    // 自动瞄准
    if (zombies.length > 0) {
      let best = null, bestD = Infinity;
      for (const z of zombies) {
        const d = dist(player.x, player.y, z.x, z.y);
        if (d < bestD) { bestD = d; best = z; }
      }
      if (best) angle = Math.atan2(best.y - player.y, best.x - player.x);
    }

    if (hasShotgun) {
      for (let i = 0; i < 5; i++) {
        const off = (i-2) * 0.12;
        createBullet(angle + off);
      }
    } else {
      createBullet(angle);
    }
  }
  function createBullet(angle) {
    const sp = 10;
    bullets.push({
      x: player.x + Math.cos(angle)*20,
      y: player.y + Math.sin(angle)*20,
      vx: Math.cos(angle)*sp, vy: Math.sin(angle)*sp,
      radius: 6, life: 80, damage: 1
    });
  }

  // ============ 更新 ============
  function updatePlayer() {
    let dx = 0, dy = 0;
    if (keys.w||keys.up) dy -= 1;
    if (keys.s||keys.down) dy += 1;
    if (keys.a||keys.left) dx -= 1;
    if (keys.d||keys.right) dx += 1;
    if (Math.abs(inputX) > 0.01 || Math.abs(inputY) > 0.01) {
      dx = inputX; dy = inputY;
    }
    if (dx || dy) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      player.x += dx * player.speed;
      player.y += dy * player.speed;
    }
    player.x = clamp(player.x, player.radius, W - player.radius);
    player.y = clamp(player.y, player.radius + 20, H - player.radius);
  }

  function updateZombies(dt) {
    const d = dt/16.67;
    for (let i = zombies.length-1; i >= 0; i--) {
      const z = zombies[i];
      const ang = Math.atan2(player.y - z.y, player.x - z.x);
      z.wobble += 0.07;
      const wob = Math.sin(z.wobble)*0.25;
      const spd = z.speed * d * 1.3;
      z.x += Math.cos(ang + wob*0.2) * spd;
      z.y += Math.sin(ang + wob*0.2) * spd;
      if (z.flash > 0) { z.flash -= 0.05*d; if (z.flash < 0) z.flash = 0; }

      if (dist(z.x, z.y, player.x, player.y) < z.radius + player.radius) {
        player.hp = Math.max(0, player.hp - 1.0*d);
        updateHp();
        const ka = Math.atan2(z.y-player.y, z.x-player.x);
        z.x += Math.cos(ka)*2.5; z.y += Math.sin(ka)*2.5;
        if (player.hp <= 0) { player.hp = 0; updateHp(); gameActive = false; return; }
      }
    }
  }

  function updateBullets() {
    for (let i = bullets.length-1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      if (b.x < -30 || b.x > W+30 || b.y < -30 || b.y > H+30 || b.life <= 0) {
        bullets.splice(i,1); continue;
      }
      let hit = false;
      for (let j = zombies.length-1; j >= 0; j--) {
        const z = zombies[j];
        if (dist(b.x, b.y, z.x, z.y) < z.radius + b.radius) {
          z.hp -= b.damage; z.flash = 1.0; hit = true;
          if (z.hp <= 0) {
            zombies.splice(j,1);
            killCount++; killCountSpan.textContent = killCount;
            beep(120, 0.18, 'sawtooth', 0.1);

            if (Math.random() < 0.20) {
              pickups.push({
                x: z.x, y: z.y, radius: 14,
                type: Math.random() < 0.5 ? 'health' : 'shotgun',
                life: 12000, bob: Math.random()*6.28
              });
            }
            if (killCount % 10 === 0) {
              currentLevel++; speedMultiplier += 0.25;
              levelDisplay.textContent = currentLevel;
              zombies.forEach(zz => zz.speed = (zz.baseSpeed||0.8)*speedMultiplier);
              spawnInterval = Math.max(400, spawnInterval - 120);
              beep(660, 0.1, 'triangle', 0.08);
              setTimeout(() => beep(880, 0.12, 'triangle', 0.08), 90);
            }
          }
          break;
        }
      }
      if (hit) bullets.splice(i,1);
    }
  }

  function updatePickups(dt) {
    for (let i = pickups.length-1; i >= 0; i--) {
      const p = pickups[i];
      p.life -= dt; p.bob += 0.05;
      if (dist(p.x, p.y, player.x, player.y) < p.radius + player.radius + 8) {
        if (p.type === 'health') { player.hp = Math.min(player.maxHp, player.hp+30); updateHp(); }
        else { hasShotgun = true; shotgunTimer = SHOTGUN_DUR; }
        beep(880, 0.1, 'sine', 0.1);
        pickups.splice(i,1); continue;
      }
      if (p.life <= 0) pickups.splice(i,1);
    }
    if (hasShotgun) {
      shotgunTimer -= dt;
      if (shotgunTimer <= 0) { hasShotgun = false; shotgunTimer = 0; }
    }
  }

  function spawnByTime(now) {
    if (!gameActive) return;
    if (now - lastSpawn > spawnInterval) {
      lastSpawn = now;
      spawnZombie();
      if (Math.random() < 0.3 && zombies.length < 25) spawnZombie();
    }
  }

  // ============ 绘制 ============
  function draw() {
    // 背景
    ctx.fillStyle = '#12181c';
    ctx.fillRect(0, 0, W, H);

    // 网格
    ctx.strokeStyle = '#1f2a30'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 50) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y <= H; y += 50) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // 掉落物
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    pickups.forEach(p => {
      const by = Math.sin(p.bob)*4;
      ctx.font = '26px sans-serif';
      ctx.shadowColor = p.type === 'health' ? '#44ff88' : '#ffaa44';
      ctx.shadowBlur = 15;
      ctx.fillText(p.type === 'health' ? '💊' : '🔥', p.x, p.y + by);
      ctx.shadowBlur = 0;
    });

    // 丧尸
    ctx.font = '30px sans-serif';
    zombies.forEach(z => {
      const by = Math.sin(z.phase + Date.now()*0.008)*3;
      ctx.fillText('🧟‍♂️', z.x, z.y + by);
    });

    // 子弹
    bullets.forEach(b => {
      ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, 6.28);
      ctx.fillStyle = '#ffe070'; ctx.fill();
      ctx.shadowBlur = 0;
    });

    // 玩家
    ctx.shadowColor = '#44cc88'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius+4, 0, 6.28);
    ctx.strokeStyle = 'rgba(80,220,140,0.6)'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.font = '36px sans-serif';
    ctx.fillText('🤠', player.x, player.y);

    // 散弹枪 BUFF 条
    if (hasShotgun) {
      const bw = 60, bh = 6;
      const bx = player.x - bw/2, by = player.y - 38;
      ctx.fillStyle = '#333'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#ffaa33';
      ctx.fillRect(bx, by, bw*(shotgunTimer/SHOTGUN_DUR), bh);
    }

    // 游戏结束
    if (!gameActive) {
      ctx.fillStyle = 'rgba(10,0,0,0.85)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#b30000';
      ctx.font = 'bold 32px "Courier New"';
      ctx.fillText('💀 你被吞噬了', W/2, H/2 - 50);
      ctx.fillStyle = '#d4af37';
      ctx.font = '22px "Courier New"';
      ctx.fillText(`击杀: ${killCount}   关卡: ${currentLevel}`, W/2, H/2 + 10);
      ctx.fillStyle = '#999';
      ctx.font = '16px "Courier New"';
      ctx.fillText('点击右上角「⟲」重来', W/2, H/2 + 60);
    }
  }

  // ============ 主循环 ============
  function loop(ts) {
    if (!lastTs) lastTs = ts;
    const dt = Math.min(32, ts - lastTs);
    lastTs = ts;

    if (gameActive) {
      updatePlayer();
      updateZombies(dt);
      updateBullets();
      updatePickups(dt);
      spawnByTime(ts);
      if (player.hp <= 0) { gameActive = false; player.hp = 0; updateHp(); }
      if (fireHeld || mouseDown) shoot(ts);
    }

    draw();
    requestAnimationFrame(loop);
  }

  // ============ 摇杆 ============
  let joyId = null, joyCx = 0, joyCy = 0, joyMax = 40;

  function joyStart(e) {
    e.preventDefault(); e.stopPropagation();
    initAudio();
    const t = e.changedTouches[0];
    joyId = t.identifier;
    const r = joystick.getBoundingClientRect();
    joyCx = r.left + r.width/2;
    joyCy = r.top + r.height/2;
    joyMax = r.width * 0.35;
    joyMove(e);
  }
  function joyMove(e) {
    if (joyId === null) return;
    e.preventDefault(); e.stopPropagation();
    let t = null;
    for (let i = 0; i < e.touches.length; i++) {
      if (e.touches[i].identifier === joyId) { t = e.touches[i]; break; }
    }
    if (!t) return;
    let dx = t.clientX - joyCx;
    let dy = t.clientY - joyCy;
    const dd = Math.hypot(dx, dy);
    if (dd > joyMax) { dx = dx/dd*joyMax; dy = dy/dd*joyMax; }
    joystickKnob.style.transform = `translate(${dx}px,${dy}px)`;
    const nx = dx/joyMax, ny = dy/joyMax;
    const dz = 0.25;
    inputX = Math.abs(nx) > dz ? nx : 0;
    inputY = Math.abs(ny) > dz ? ny : 0;
  }
  function joyEnd(e) {
    if (joyId === null) return;
    e.preventDefault(); e.stopPropagation();
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyId) {
        joyId = null; inputX = 0; inputY = 0;
        joystickKnob.style.transform = 'translate(0,0)';
        break;
      }
    }
  }

  joystick.addEventListener('touchstart', joyStart, { passive: false });
  joystick.addEventListener('touchmove', joyMove, { passive: false });
  joystick.addEventListener('touchend', joyEnd, { passive: false });
  joystick.addEventListener('touchcancel', joyEnd, { passive: false });

  // ============ 射击按钮 ============
  let fireId = null;
  function fireStart(e) {
    e.preventDefault(); e.stopPropagation();
    initAudio();
    if (!gameActive) return;
    fireId = e.changedTouches[0].identifier;
    fireHeld = true;
    fireButton.classList.add('pressed');
    shoot(performance.now());
  }
  function fireEnd(e) {
    if (fireId === null) return;
    e.preventDefault(); e.stopPropagation();
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === fireId) {
        fireId = null; fireHeld = false;
        fireButton.classList.remove('pressed');
        break;
      }
    }
  }
  fireButton.addEventListener('touchstart', fireStart, { passive: false });
  fireButton.addEventListener('touchend', fireEnd, { passive: false });
  fireButton.addEventListener('touchcancel', fireEnd, { passive: false });

  // ============ 阻止页面滑动 ============
  canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => {
    if (!e.target.closest('#joystick') && !e.target.closest('#fireButton')) {
      e.preventDefault();
    }
  }, { passive: false });

  // ============ 桌面端：键盘 + 鼠标 ============
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if (k === 'w') keys.w = true;
    if (k === 'a') keys.a = true;
    if (k === 's') keys.s = true;
    if (k === 'd') keys.d = true;
    if (k === 'arrowup') keys.up = true;
    if (k === 'arrowdown') keys.down = true;
    if (k === 'arrowleft') keys.left = true;
    if (k === 'arrowright') keys.right = true;
  });
  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 'w') keys.w = false;
    if (k === 'a') keys.a = false;
    if (k === 's') keys.s = false;
    if (k === 'd') keys.d = false;
    if (k === 'arrowup') keys.up = false;
    if (k === 'arrowdown') keys.down = false;
    if (k === 'arrowleft') keys.left = false;
    if (k === 'arrowright') keys.right = false;
  });
  window.addEventListener('blur', () => {
    keys.w = keys.a = keys.s = keys.d = false;
    keys.up = keys.down = keys.left = keys.right = false;
    mouseDown = false; fireHeld = false;
    inputX = 0; inputY = 0;
    joystickKnob.style.transform = 'translate(0,0)';
  });

  // 鼠标射击
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) * (W / r.width);
    mouse.y = (e.clientY - r.top) * (H / r.height);
    mouseActive = true;
    aimAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  });
  canvas.addEventListener('mousedown', e => {
    e.preventDefault();
    initAudio();
    if (e.button === 0) { mouseDown = true; shoot(performance.now()); }
  });
  window.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // 重启按钮
  restartBtn.addEventListener('click', reset);
  restartBtn.addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation(); reset();
  }, { passive: false });

  // 窗口尺寸变化时重新适配
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 150));

  // ============ 启动 ============
  reset();
  requestAnimationFrame(loop);

  // 首次触摸初始化音频
  document.addEventListener('touchstart', function once() {
    initAudio();
    document.removeEventListener('touchstart', once);
  }, { once: true });

})();
</script>
</body>
</html>
